server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 大檔案從 persistent volume 讀取
    # Root 層動態資料（aviation/ship/temperature）
    location ~ ^/(aviation_data\.json|ship_data\.json|temperature_grid\.json)$ {
        root /data;
        expires 1d;
        add_header Cache-Control "public";
    }

    # 靜態 GeoJSON：先找 /data/geo/（S3 大檔），找不到 fallback 到 dist（git 小檔）
    location /geo/ {
        root /data;
        try_files $uri @dist;
        expires 1d;
        add_header Cache-Control "public";
    }

    # H3 預聚合：res8 大檔在 /data/h3/，res7 小檔在 dist → fallback
    location /h3/ {
        root /data;
        try_files $uri @dist;
        expires 1d;
        add_header Cache-Control "public";
    }

    # 公車路線：三大檔在 /data/bus/，20 個小檔縣市在 dist → fallback
    location /bus/ {
        root /data;
        try_files $uri @dist;
        expires 1d;
        add_header Cache-Control "public";
    }

    # 林業 GeoJSON + PMTiles：大檔在 /data/forestry/（S3），git 小檔在 dist → fallback
    location /forestry/ {
        root /data;
        try_files $uri @dist;
        expires 1d;
        add_header Cache-Control "public";
    }

    # 養殖漁業 GeoJSON + PMTiles：ponds/衛星偵測 大檔 PMTiles 在 /data/fishery/（S3），git 小檔 geojson 在 dist → fallback
    location /fishery/ {
        root /data;
        try_files $uri @dist;
        expires 1d;
        add_header Cache-Control "public";
    }

    # 水資源 PMTiles（湖泊/埤塘 OSM）在 /data/water_resources/（純 S3，無 git 小檔，不需 fallback）
    location /water_resources/ {
        root /data;
        expires 1d;
        add_header Cache-Control "public";
    }

    # 都市開放空間 PMTiles（台北行道樹變化）在 /data/urban/（S3 大檔），git 小檔在 dist → fallback
    location /urban/ {
        root /data;
        try_files $uri @dist;
        expires 1d;
        add_header Cache-Control "public";
    }

    # 藝文文化 GeoJSON 全部 git 管理（<3MB，dist 供檔）；/data/culture/ 通常為空，靠 fallback
    location /culture/ {
        root /data;
        try_files $uri @dist;
        expires 1d;
        add_header Cache-Control "public";
    }

    # 公共設施 GeoJSON 全部 git 管理（<2MB，dist 供檔）；/data/civic_facilities/ 通常為空，靠 fallback
    location /civic_facilities/ {
        root /data;
        try_files $uri @dist;
        expires 1d;
        add_header Cache-Control "public";
    }

    # 災害靜態 GeoJSON 全部 git 管理（山域事故 2.1MB，dist 供檔）；/data/hazards/ 通常為空，靠 fallback
    location /hazards/ {
        root /data;
        try_files $uri @dist;
        expires 1d;
        add_header Cache-Control "public";
    }

    # 環境：大檔 PMTiles（都市熱島 LST 30MB）在 /data/environment/（S3），
    # git 小檔 GeoJSON（public_toilets 2.7MB）在 dist → fallback
    location /environment/ {
        root /data;
        try_files $uri @dist;
        expires 1d;
        add_header Cache-Control "public";
    }

    # POI GeoJSON 全部 git 管理（<2MB，dist 供檔）；/data/poi/ 通常為空，靠 fallback
    location /poi/ {
        root /data;
        try_files $uri @dist;
        expires 1d;
        add_header Cache-Control "public";
    }

    # 🌍 世界 World GeoJSON（Outerview 全球垃圾殘骸 3.8MB）：大檔在 /data/world/（S3），
    # git 小檔在 dist → fallback（比照 forestry/urban 慣例）
    location /world/ {
        root /data;
        try_files $uri @dist;
        expires 1d;
        add_header Cache-Control "public";
    }

    # 觀光 GeoJSON：D 類 3 大檔（景點/旅宿/餐飲）在 /data/tourism/（S3），
    # C 類 9 小檔在 dist（git）→ fallback（比照 forestry/fishery/urban 慣例）
    location /tourism/ {
        root /data;
        try_files $uri @dist;
        expires 1d;
        add_header Cache-Control "public";
    }

    # 農業 GeoJSON + PMTiles 在 /data/agriculture/（純 S3，無 git 小檔，不需 fallback）
    location /agriculture/ {
        root /data;
        expires 1d;
        add_header Cache-Control "public";
    }

    # 🏟️ 運動場館 GeoJSON 在 /data/sports/（純 S3，8.4MB 不進 git，不需 fallback）
    location /sports/ {
        root /data;
        expires 1d;
        add_header Cache-Control "public";
    }

    # 靜態化 RPC 快照 JSON 在 /data/static-rpc/（純 S3，無 git 小檔，不需 fallback）
    # 見 docs/features/static-to-cdn：把靜態層從 Supabase RPC 搬成 CDN 檔，脫離併發排隊 + DB O(N)
    location /static-rpc/ {
        root /data;
        expires 1d;
        add_header Cache-Control "public";
    }

    # 房地產 + 加油站覆蓋 PMTiles：real_estate_* 大檔在 /data/coverage/（S3），
    # gas coverage 小檔在 dist（git）→ fallback
    location /coverage/ {
        root /data;
        try_files $uri @dist;
        expires 1d;
        add_header Cache-Control "public";
    }

    # 給 /geo /h3 /bus 用的 dist fallback（build 出來的 git-tracked 小檔）
    location @dist {
        root /usr/share/nginx/html;
    }

    # 醫療 PMTiles 向量切片（基礎點位 + 等時圈）在 /data/medical/
    location /medical/ {
        root /data;
        expires 1d;
        add_header Cache-Control "public";
    }

    # Base map PMTiles（行政邊界 + 等高線 + OSM 路網）在 /data/base_map/
    # 同 PMTiles range request 慣例，gzip 自動 bypass
    location /base_map/ {
        root /data;
        expires 1d;
        add_header Cache-Control "public";
    }

    # 全球氣候 PMTiles（CMEMS 海流 / CAMS 沙塵 / NOAA GFS 風場 衍生切片）在 /data/climate/
    location /climate/ {
        root /data;
        expires 1d;
        add_header Cache-Control "public";
    }

    # 消防 PMTiles 向量切片（救援等時圈）在 /data/fire/
    # PMTiles 透過 HTTP Range Request 載瓦片，nginx 預設支援；
    # 內含 gzip 壓縮，不要再走 gzip_types（pmtiles 不在 gzip_types 內，自動 bypass ✓）
    location /fire/ {
        root /data;
        expires 1d;
        add_header Cache-Control "public";
    }

    # 警政司法民防 GeoJSON + PMTiles 在 /data/police_justice/
    # 19 個 dataset 子目錄（含 civil_defense_shelters / crime_area_monthly / court_jurisdictions PMTiles）
    location /police_justice/ {
        root /data;
        expires 1d;
        add_header Cache-Control "public";
    }

    # 路況省道幾何 PMTiles（road_congestion_highway，前端 setFeatureState 染色）在 /data/road/
    # 純 S3（不進 git，無需 dist fallback）；PMTiles range request 慣例，gzip 自動 bypass
    location /road/ {
        root /data;
        expires 1d;
        add_header Cache-Control "public";
    }

    # Rail 資料
    location /rail/ {
        root /data;
        expires 1d;
        add_header Cache-Control "public";
    }

    # （已移除 /api/ → pulse-api proxy：前端全走 Supabase，不再使用 pulse-api。
    #   移除後 nginx 啟動不再依賴 pulse-api 是否存活，消除整站啟動失敗風險。
    #   pulse-api 服務本身不受影響；其他消費者直接打它自己的網址即可。）

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;

        # ── BC-4 公開前置：安全 header（2026-07-04）────────────────────────────
        # 立即生效（零破壞風險）：防點擊劫持 / 防 MIME 嗅探 / Referrer 收斂。
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # CSP：先上 Report-Only（不阻擋、violation 進瀏覽器 console 可觀察），零白畫面風險。
        #   connect-src = BYOK 對話金鑰/資料只能送這些 host（三家 LLM + Supabase + Mapbox + CDN），
        #   是 BYOK 防金鑰外洩的核心；img-src/frame-src 放寬 https: 因 CCTV/新聞圖/YouTube 直播是動態多來源。
        # ⚠️ 切正式 enforcing 的步驟（browser 實測全功能無 violation 後）：
        #   把下行 header 名稱 `Content-Security-Policy-Report-Only` 改成 `Content-Security-Policy` 即可。
        add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; worker-src 'self' blob:; child-src 'self' blob:; connect-src 'self' https://utcmcikhvxnohbxchbrs.supabase.co wss://utcmcikhvxnohbxchbrs.supabase.co https://api.mapbox.com https://events.mapbox.com https://*.tiles.mapbox.com https://api.anthropic.com https://api.openai.com https://generativelanguage.googleapis.com https://data.itsmigu.com https://pub-eae6980c040441adbd1eaded2870d3d2.r2.dev; frame-src 'self' https:; media-src 'self' blob: https:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
        # ──────────────────────────────────────────────────────────────────────
    }

    # 靜態資源快取
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml image/svg+xml;
    gzip_min_length 256;
}
