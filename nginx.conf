server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 大檔案從 persistent volume 讀取
    # Root 層動態資料（aviation/ship/temperature）
    location ~ ^/(aviation_data\.json|ship_data\.json|temperature_grid\.json)$ {
        root /data;
        expires 1d;
        add_header Cache-Control "public";
    }

    # 靜態 GeoJSON：先找 /data/geo/（S3 大檔），找不到 fallback 到 dist（git 小檔）
    location /geo/ {
        root /data;
        try_files $uri @dist;
        expires 1d;
        add_header Cache-Control "public";
    }

    # H3 預聚合：res8 大檔在 /data/h3/，res7 小檔在 dist → fallback
    location /h3/ {
        root /data;
        try_files $uri @dist;
        expires 1d;
        add_header Cache-Control "public";
    }

    # 公車路線：三大檔在 /data/bus/，20 個小檔縣市在 dist → fallback
    location /bus/ {
        root /data;
        try_files $uri @dist;
        expires 1d;
        add_header Cache-Control "public";
    }

    # 林業 GeoJSON + PMTiles：大檔在 /data/forestry/（S3），git 小檔在 dist → fallback
    location /forestry/ {
        root /data;
        try_files $uri @dist;
        expires 1d;
        add_header Cache-Control "public";
    }

    # 養殖漁業 GeoJSON + PMTiles：ponds/衛星偵測 大檔 PMTiles 在 /data/fishery/（S3），git 小檔 geojson 在 dist → fallback
    location /fishery/ {
        root /data;
        try_files $uri @dist;
        expires 1d;
        add_header Cache-Control "public";
    }

    # 水資源 PMTiles（湖泊/埤塘 OSM）在 /data/water_resources/（純 S3，無 git 小檔，不需 fallback）
    location /water_resources/ {
        root /data;
        expires 1d;
        add_header Cache-Control "public";
    }

    # 淹水感測 3 分步行圈 PMTiles 在 /data/flood/（S3），git 小檔（uswg_isochrone_3min.pmtiles 47KB）
    # 在 dist → fallback。⚠️ 2026-08-12 補：upload/pull 兩端 6 月起就推 deploy-assets/flood/ →
    # /data/flood/，但這裡沒有 location → S3 那條路整條死（前端靠 SPA root 從 dist 撈到才沒爆）。
    # 同 forestry/fishery 慣例，兩條路都活。
    location /flood/ {
        root /data;
        try_files $uri @dist;
        expires 1d;
        add_header Cache-Control "public";
    }

    # 都市開放空間 PMTiles（台北行道樹變化）在 /data/urban/（S3 大檔），git 小檔在 dist → fallback
    location /urban/ {
        root /data;
        try_files $uri @dist;
        expires 1d;
        add_header Cache-Control "public";
    }

    # 藝文文化 GeoJSON 全部 git 管理（<3MB，dist 供檔）；/data/culture/ 通常為空，靠 fallback
    location /culture/ {
        root /data;
        try_files $uri @dist;
        expires 1d;
        add_header Cache-Control "public";
    }

    # 公共設施 GeoJSON 全部 git 管理（<2MB，dist 供檔）；/data/civic_facilities/ 通常為空，靠 fallback
    location /civic_facilities/ {
        root /data;
        try_files $uri @dist;
        expires 1d;
        add_header Cache-Control "public";
    }

    # 宗教：temples PMTiles 4.1MB + 4 個 GeoJSON 全 git 管理（dist 供檔）；
    # /data/religion/ 通常為空，靠 fallback（同 civic_facilities 慣例，保留同構以備日後大檔）
    location /religion/ {
        root /data;
        try_files $uri @dist;
        expires 1d;
        add_header Cache-Control "public";
    }

    # 殯葬：5 檔共 5.77MB 全 git 管理（dist 供檔）；/data/funeral/ 通常為空，
    # 靠 fallback（同 religion 慣例，保留同構以備日後大檔）
    location /funeral/ {
        root /data;
        try_files $uri @dist;
        expires 1d;
        add_header Cache-Control "public";
    }

    # 社福長照：9 檔共 5.4MB 全 git 管理（dist 供檔）；/data/welfare/ 通常為空，
    # 靠 fallback（同 funeral 慣例，保留同構以備日後大檔）
    location /welfare/ {
        root /data;
        try_files $uri @dist;
        expires 1d;
        add_header Cache-Control "public";
    }

    # 災害靜態 GeoJSON 全部 git 管理（山域事故 2.1MB，dist 供檔）；/data/hazards/ 通常為空，靠 fallback
    location /hazards/ {
        root /data;
        try_files $uri @dist;
        expires 1d;
        add_header Cache-Control "public";
    }

    # 環境：大檔 PMTiles（都市熱島 LST 30MB）在 /data/environment/（S3），
    # git 小檔 GeoJSON（public_toilets 2.7MB）在 dist → fallback
    location /environment/ {
        root /data;
        try_files $uri @dist;
        expires 1d;
        add_header Cache-Control "public";
    }

    # POI GeoJSON 全部 git 管理（<2MB，dist 供檔）；/data/poi/ 通常為空，靠 fallback
    location /poi/ {
        root /data;
        try_files $uri @dist;
        expires 1d;
        add_header Cache-Control "public";
    }

    # 🌍 世界 World GeoJSON（Outerview 全球垃圾殘骸 3.8MB）：大檔在 /data/world/（S3），
    # git 小檔在 dist → fallback（比照 forestry/urban 慣例）
    location /world/ {
        root /data;
        try_files $uri @dist;
        expires 1d;
        add_header Cache-Control "public";
    }

    # GFW hourly unified root：manifest 是可變指標，短快取並允許 edge stale；
    # release 內 tracks/grid/dark_vessels 檔名皆由 release_id 鎖定，保留 7 日 immutable。
    location = /global-maritime/gfw-hourly/manifest.json {
        root /data;
        try_files $uri =404;
        add_header Cache-Control "public,max-age=60,s-maxage=60,stale-while-revalidate=300" always;
    }

    location ^~ /global-maritime/gfw-hourly/releases/ {
        root /data;
        try_files $uri =404;
        add_header Cache-Control "public,max-age=604800,s-maxage=604800,immutable" always;
    }

    location ^~ /global-maritime/ {
        root /data;
        try_files $uri =404;
    }

    # 觀光 GeoJSON：D 類 3 大檔（景點/旅宿/餐飲）在 /data/tourism/（S3），
    # C 類 9 小檔在 dist（git）→ fallback（比照 forestry/fishery/urban 慣例）
    location /tourism/ {
        root /data;
        try_files $uri @dist;
        expires 1d;
        add_header Cache-Control "public";
    }

    # 農業 GeoJSON + PMTiles 在 /data/agriculture/（純 S3，無 git 小檔，不需 fallback）
    location /agriculture/ {
        root /data;
        expires 1d;
        add_header Cache-Control "public";
    }

    # 工商登記版本化資產：dated filename immutable，純 S3 volume，無 dist fallback。
    location /business_registry/ {
        root /data;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # 產業園區版本化 PMTiles：純 S3 volume，無 dist fallback。
    location /industrial_zone/ {
        root /data;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # 🏟️ 運動場館 GeoJSON 在 /data/sports/（純 S3，8.4MB 不進 git，不需 fallback）
    location /sports/ {
        root /data;
        expires 1d;
        add_header Cache-Control "public";
    }

    # 🎓 教育 GeoJSON + PMTiles 在 /data/education/（純 S3，schools 2.5MB + campus_polygon 4.4MB
    # 皆 gitignore，不需 fallback）
    location /education/ {
        root /data;
        expires 1d;
        add_header Cache-Control "public";
    }

    # 靜態化 RPC 快照 JSON 在 /data/static-rpc/（純 S3，無 git 小檔，不需 fallback）
    # 見 docs/features/static-to-cdn：把靜態層從 Supabase RPC 搬成 CDN 檔，脫離併發排隊 + DB O(N)
    location /static-rpc/ {
        root /data;
        expires 1d;
        add_header Cache-Control "public";
    }

    # 房地產 + 加油站覆蓋 PMTiles：real_estate_* 大檔在 /data/coverage/（S3），
    # gas coverage 小檔在 dist（git）→ fallback
    location /coverage/ {
        root /data;
        try_files $uri @dist;
        expires 1d;
        add_header Cache-Control "public";
    }

    # 給 /geo /h3 /bus 用的 dist fallback（build 出來的 git-tracked 小檔）
    location @dist {
        root /usr/share/nginx/html;
    }

    # 醫療 PMTiles 向量切片（基礎點位 + 等時圈）在 /data/medical/
    location /medical/ {
        root /data;
        expires 1d;
        add_header Cache-Control "public";
    }

    # Base map PMTiles（行政邊界 + 海域界線 + 等高線 + OSM 路網）在 /data/base_map/
    # ⚠️ 純 volume（無 dist fallback）→ 目錄內任何新增切片都必須經 upload-deploy-assets.sh 上 S3
    # 同 PMTiles range request 慣例，gzip 自動 bypass
    location /base_map/ {
        root /data;
        expires 1d;
        add_header Cache-Control "public";
    }

    # 全球氣候 PMTiles（CMEMS 海流 / CAMS 沙塵 / NOAA GFS 風場 衍生切片）在 /data/climate/
    #
    # ⚠️ 必須用 `^~`：本檔末尾有 `location ~* \.(js|css|png|...)$` 的**正則** location，
    #    而 nginx 的正則優先序高於普通前綴匹配。該正則 block 沒有自己的 root，
    #    會落回 server 層的 `root /usr/share/nginx/html`（dist）——
    #    結果 /climate/*.png 供的是 **build 當下的 dist 快照**，
    #    `refresh-climate.sh` 每輪更新到 S3 的新貼圖使用者永遠拿不到，
    #    還被那條正則加上 7 天 immutable 快取。
    #    2026-08-14 實測：線上 dust_latest.png 17,649B vs S3 18,027B（currents/wind10m 同樣落後）。
    #    `^~` 讓前綴匹配勝出、不再進正則比對，/climate/ 一律走 /data。
    location ^~ /climate/ {
        root /data;
        expires 1d;
        add_header Cache-Control "public";
    }

    # 消防 PMTiles 向量切片（救援等時圈）在 /data/fire/
    # PMTiles 透過 HTTP Range Request 載瓦片，nginx 預設支援；
    # 內含 gzip 壓縮，不要再走 gzip_types（pmtiles 不在 gzip_types 內，自動 bypass ✓）
    location /fire/ {
        root /data;
        expires 1d;
        add_header Cache-Control "public";
    }

    # 警政司法民防 GeoJSON + PMTiles 在 /data/police_justice/
    # 19 個 dataset 子目錄（含 civil_defense_shelters / crime_area_monthly / court_jurisdictions PMTiles）
    location /police_justice/ {
        root /data;
        expires 1d;
        add_header Cache-Control "public";
    }

    # 路況省道幾何 PMTiles（road_congestion_highway，前端 setFeatureState 染色）在 /data/road/
    # 純 S3（不進 git，無需 dist fallback）；PMTiles range request 慣例，gzip 自動 bypass
    location /road/ {
        root /data;
        expires 1d;
        add_header Cache-Control "public";
    }

    # Rail 資料
    location /rail/ {
        root /data;
        expires 1d;
        add_header Cache-Control "public";
    }

    # （已移除 /api/ → pulse-api proxy：前端全走 Supabase，不再使用 pulse-api。
    #   移除後 nginx 啟動不再依賴 pulse-api 是否存活，消除整站啟動失敗風險。
    #   pulse-api 服務本身不受影響；其他消費者直接打它自己的網址即可。）

    # EM-15 嵌入用歷史快照（scripts/export/export-embed-snapshot.sh 產出）
    # 純 S3（不進 git，無需 dist fallback）。內容是凍結的某一天，可長快取。
    location /embed-snapshots/ {
        root /data;
        # 檔名含日期且**內容永不改變**（凍結的某一天）→ 天然 cache busting，可 immutable。
        # 要換內容一律換檔名（新日期），不會有「使用者拿到舊快取」的問題。
        expires 1y;
        add_header Cache-Control "public, immutable";
        # EM-16：本夾同時有 plaActivity 的純 `.geojson` 與 flights/ships/rail 的 `.json.gz`。
        # `.json.gz` **刻意不設 Content-Encoding**（決定見 upload-deploy-assets.sh 同段註解）：
        #   - nginx 的 mime.types **沒有 `gz` 也沒有 `geojson`** 的對應 → 兩者都落到
        #     http 層 `default_type application/octet-stream`（nginx:alpine 預設），
        #     不在下方 `gzip_types` 內 → 不會被即時壓縮，`.json.gz` 更不會被二次壓縮 ✓
        #     （本機 prod-like nginx 實測：`.json.gz` 與 `.geojson` 回應皆無 Content-Encoding，
        #       Content-Length 等於原檔大小；對照組 `.json` 則正常帶 Content-Encoding: gzip）
        #   - 不宣告 Content-Encoding → 瀏覽器拿到原樣 gzip bytes，
        #     由前端 `fetchMaybeGzipJson()` 用 magic byte(0x1f 0x8b) 自行 gunzip，
        #     與 dev（vite 直接送檔）行為一致，不會出現「宣告 gzip 但實際已解壓」的矛盾。
    }

    # EM-16 嵌入用鐵路幾何 bundle（rail_slim.<hash>.json.gz，367KB）
    # 純 S3（不進 git，無需 dist fallback）。**兩條 location**，因為這裡有兩種壽命的檔：
    #
    #   指標檔 rail-manifest.json —— 必須「很快反映新 hash」，短快取
    #   bundle rail_slim.<hash>.json.gz —— 檔名 = 內容的 sha256 前 10 碼，可永久快取
    #
    # `location = ` 是精確匹配，優先序高於下面的前綴匹配，與擺放順序無關。
    location = /embed-rail/rail-manifest.json {
        root /data;
        # 為什麼是 max-age=60 而不是 no-cache：
        #   - manifest 在 **critical path 上且是串行的**（讀 manifest 才知道要抓哪個 bundle）。
        #     `no-cache` = 每次載入都要 revalidate，等於每個讀者每次都多付一個 RTT，
        #     而它保護的東西只是「幾何更新後早 60 秒看到」——換不回這個成本。
        #   - 60 秒的陳舊窗**天生無害**：產生器 `--keep 3` 保證舊 hash 檔還在，
        #     拿到舊 manifest 的讀者抓到的是**能用的舊幾何**，不是 404。
        #   - 部署後 60 秒內全球一致收斂，仍遠優於原本的 1d（+CDN 1d）。
        expires 60s;
        add_header Cache-Control "public, max-age=60";
    }

    # 雜湊檔名 ⇒ URL 唯一對應一份永不改變的內容 ⇒ 可安全 immutable。
    # **這正是這次改動的收益**：舊版是固定檔名，只敢給 1d，幾何更新後讀者最慘要等
    # 兩天（CDN 1d + 瀏覽器 1d）才看得到新軌道，且 purge 只能整站 purge_everything
    # （會連 297MB 底圖一起清）。改成內容雜湊後**完全不需要清快取** —— 內容變 = 檔名變 =
    # 新 URL，舊 URL 的快取放著爛掉也無妨，與 /embed-snapshots/（檔名含日期）同一個原理。
    #
    # 過渡期的舊固定檔名 `rail_slim.json.gz` 也落在這條規則下，同樣安全：
    # 產生器已經**只寫雜湊檔名**，S3 上那份固定檔名檔從此凍結不再更新
    # （前端 fallback 移除後即可刪除，見 src/embed/railReplayData.ts 的 TODO）。
    # 內容不會再變 ⇒ immutable 對它無害。
    #
    # `.json.gz` 的 Content-Encoding 處理同 /embed-snapshots/（不設，前端自解）。
    location /embed-rail/ {
        root /data;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # EM-06 嵌入版：/embed 與 /embed.html 都指到獨立 entry（MapLibre，不載入 mapbox-gl）
    # 放在 SPA fallback 之前，否則 /embed 會被 try_files 吃進 index.html
    location = /embed {
        try_files /embed.html =404;

        # ⚠️ nginx 的 add_header 不繼承：本 location 一旦有自己的 add_header，
        #    父層（location /）那組就完全不套用 → 安全 header 必須在此重複宣告。
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "frame-ancestors *" always;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;

        # ── BC-4 公開前置：安全 header（2026-07-04）────────────────────────────
        # 立即生效（零破壞風險）：防 MIME 嗅探 / Referrer 收斂。
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # ── EM-02 可嵌入地圖（2026-08-03）──────────────────────────────────────
        # 原 `X-Frame-Options "SAMEORIGIN"` 已移除：它不支援白名單語法（ALLOW-FROM 早已廢棄），
        # 要允許外站嵌入就只能整條拿掉，改用 CSP frame-ancestors 控制。
        # ⚠️ frame-ancestors 在 -Report-Only 下【不生效】，所以必須另立一條 enforcing CSP；
        #    下方 :241 的 Report-Only 整條維持不動（一次轉正式會炸掉 Mapbox/Supabase/R2）。
        # 收斂為白名單時改成：frame-ancestors 'self' https://<允許網域>;
        add_header Content-Security-Policy "frame-ancestors *" always;
        # ──────────────────────────────────────────────────────────────────────

        # CSP：先上 Report-Only（不阻擋、violation 進瀏覽器 console 可觀察），零白畫面風險。
        #   connect-src = BYOK 對話金鑰/資料只能送這些 host（三家 LLM + Supabase + Mapbox + CDN），
        #   是 BYOK 防金鑰外洩的核心；img-src/frame-src 放寬 https: 因 CCTV/新聞圖/YouTube 直播是動態多來源。
        # ⚠️ 切正式 enforcing 的步驟（browser 實測全功能無 violation 後）：
        #   把下行 header 名稱 `Content-Security-Policy-Report-Only` 改成 `Content-Security-Policy` 即可。
        add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data: https://protomaps.github.io; worker-src 'self' blob:; child-src 'self' blob:; connect-src 'self' https://protomaps.github.io https://utcmcikhvxnohbxchbrs.supabase.co wss://utcmcikhvxnohbxchbrs.supabase.co https://api.mapbox.com https://events.mapbox.com https://*.tiles.mapbox.com https://api.anthropic.com https://api.openai.com https://generativelanguage.googleapis.com https://data.itsmigu.com https://pub-eae6980c040441adbd1eaded2870d3d2.r2.dev; frame-src 'self' https:; media-src 'self' blob: https:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors *" always;
        # ──────────────────────────────────────────────────────────────────────
    }

    # 靜態資源快取
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml image/svg+xml;
    gzip_min_length 256;
}
