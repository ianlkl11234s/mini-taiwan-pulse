server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 大檔案從 persistent volume 讀取
    # Root 層動態資料（aviation/ship/temperature）
    location ~ ^/(aviation_data\.json|ship_data\.json|temperature_grid\.json)$ {
        root /data;
        expires 1d;
        add_header Cache-Control "public";
    }

    # 靜態 GeoJSON：先找 /data/geo/（S3 大檔），找不到 fallback 到 dist（git 小檔）
    location /geo/ {
        root /data;
        try_files $uri @dist;
        expires 1d;
        add_header Cache-Control "public";
    }

    # H3 預聚合：res8 大檔在 /data/h3/，res7 小檔在 dist → fallback
    location /h3/ {
        root /data;
        try_files $uri @dist;
        expires 1d;
        add_header Cache-Control "public";
    }

    # 公車路線：三大檔在 /data/bus/，20 個小檔縣市在 dist → fallback
    location /bus/ {
        root /data;
        try_files $uri @dist;
        expires 1d;
        add_header Cache-Control "public";
    }

    # 農業 GeoJSON + PMTiles 在 /data/agriculture/（純 S3，無 git 小檔，不需 fallback）
    location /agriculture/ {
        root /data;
        expires 1d;
        add_header Cache-Control "public";
    }

    # 給 /geo /h3 /bus 用的 dist fallback（build 出來的 git-tracked 小檔）
    location @dist {
        root /usr/share/nginx/html;
    }

    # 消防 PMTiles 向量切片（救援等時圈）在 /data/fire/
    # PMTiles 透過 HTTP Range Request 載瓦片，nginx 預設支援；
    # 內含 gzip 壓縮，不要再走 gzip_types（pmtiles 不在 gzip_types 內，自動 bypass ✓）
    location /fire/ {
        root /data;
        expires 1d;
        add_header Cache-Control "public";
    }

    # Rail 資料
    location /rail/ {
        root /data;
        expires 1d;
        add_header Cache-Control "public";
    }

    # Pulse API proxy（Zeabur 內部網路）
    location /api/ {
        proxy_pass http://mini-tw-pulse-api.zeabur.internal:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
        proxy_read_timeout 120s;
        # 大回應（/ships/day 可能數 MB）需要足夠 buffer
        proxy_buffering on;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 靜態資源快取
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml image/svg+xml;
    gzip_min_length 256;
}
