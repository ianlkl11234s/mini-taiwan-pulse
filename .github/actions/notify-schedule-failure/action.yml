name: notify-schedule-failure
description: 排程 workflow 連續失敗第 N 次（預設 2）送 Telegram 🔴，連續失敗後恢復送 ✅（狀態取自 GitHub run 歷史，不另存）
inputs:
  token:
    description: Telegram bot token（空值則略過）
    required: false
    default: ''
  chat:
    description: Telegram chat id（空值則略過）
    required: false
    default: ''
  repo:
    description: owner/repo
    required: true
  workflow:
    description: 被監看 workflow 的 name
    required: true
  run-id:
    description: 本次 workflow_run 的 id
    required: true
  conclusion:
    description: 本次 workflow_run 的 conclusion
    required: true
  run-url:
    description: 本次 workflow_run 的網址
    required: true
  run-attempt:
    description: 本次 workflow_run 的 run_attempt（>1 表示重跑，會查上一個 attempt 的結果）
    required: false
    default: '1'
  threshold:
    description: 連續失敗幾次才通知（1＝第一次失敗就通知）
    required: false
    default: '2'
runs:
  using: composite
  steps:
    - name: 判斷並送出 Telegram
      shell: bash
      env:
        TG_TOKEN: ${{ inputs.token }}
        TG_CHAT: ${{ inputs.chat }}
        REPO: ${{ inputs.repo }}
        WORKFLOW: ${{ inputs.workflow }}
        RUN_ID: ${{ inputs.run-id }}
        CONCLUSION: ${{ inputs.conclusion }}
        RUN_URL: ${{ inputs.run-url }}
        RUN_ATTEMPT: ${{ inputs.run-attempt }}
        THRESHOLD: ${{ inputs.threshold }}
        ACTION_PATH: ${{ github.action_path }}
      run: |
        set -euo pipefail
        if [ -z "$TG_TOKEN" ] || [ -z "$TG_CHAT" ]; then
          echo "::notice::未設定 Telegram secrets，略過"
          exit 0
        fi
        hist="$(gh run list -R "$REPO" -w "$WORKFLOW" --event schedule -L 10 --json databaseId,conclusion)"
        prev_attempt=""
        if [ "${RUN_ATTEMPT:-1}" -gt 1 ] 2>/dev/null; then
          prev_attempt="$(gh api "repos/$REPO/actions/runs/$RUN_ID/attempts/$((RUN_ATTEMPT - 1))" --jq '.conclusion // ""')"
        fi
        verdict="$(printf '%s' "$hist" | bash "$ACTION_PATH/decide.sh" "$RUN_ID" "$CONCLUSION" "$THRESHOLD" "$prev_attempt")"
        case "$verdict" in
          fail)    if [ "$THRESHOLD" = 1 ]; then msg="🔴 排程檢查失敗：${REPO}/${WORKFLOW} ${RUN_URL}"; else msg="🔴 排程連續失敗 ${THRESHOLD} 次：${REPO}/${WORKFLOW} ${RUN_URL}"; fi ;;
          recover) msg="✅ 排程恢復：${REPO}/${WORKFLOW} ${RUN_URL}" ;;
          *) echo "判斷=none，不送"; exit 0 ;;
        esac
        echo "判斷=$verdict，送出通知"
        curl -fsS --max-time 20 -o /dev/null \
          "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
          --data-urlencode "chat_id=${TG_CHAT}" \
          --data-urlencode "text=${msg}" \
          --data-urlencode "disable_web_page_preview=true"
