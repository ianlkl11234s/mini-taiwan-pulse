name: CI

on:
  pull_request:
    branches: [master, develop]
  push:
    branches: [master, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # AU-6：package-lock.json 是唯一 lockfile SSOT（見 .claude/memory/PRINCIPLES.md）
      # 「動了 package.json 卻沒同步 package-lock.json」由下一步 npm ci 自己擋（不同步即報錯拒建）
      - name: Single-lockfile guard (no pnpm-lock.yaml)
        run: |
          if [ -f pnpm-lock.yaml ]; then
            echo "::error::偵測到 pnpm-lock.yaml。本 repo 唯一 lockfile 是 package-lock.json（AU-6）。"
            echo "改依賴請跑：npm install --package-lock-only"
            exit 1
          fi

      - run: npm ci

      - name: TypeScript build (tsc -b + vite build)
        run: npm run build

      - name: Tests (vitest)
        run: npm test

      # 圖層樣式盤點必須與程式同步（docs/design-system/map-layers.md §6）
      - name: Design layer inventory up to date
        run: |
          npm run -s design:audit-layers
          if ! git diff --quiet -- docs/design-system/layer-style-inventory.json; then
            git diff --stat -- docs/design-system/layer-style-inventory.json
            echo "::error::layer-style-inventory.json 與目前圖層樣式不一致。請執行 npm run design:audit-layers 並提交結果（確認差異只動到本次改的圖層）。"
            exit 1
          fi

      - name: Private coral backend tests
        run: |
          npm ci --prefix server/coral-private
          npm test --prefix server/coral-private
