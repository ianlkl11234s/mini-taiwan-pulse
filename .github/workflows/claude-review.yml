name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # v1.0.100+ may report a successful install without creating the CLI binary.
      # Keep this pinned until anthropics/claude-code-action#1242 is fixed upstream.
      - uses: anthropics/claude-code-action@v1.0.99
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            只 review 本 PR 的 diff，不要主動讀 diff 以外的檔案，不要全 repo 探索。
            檢查：明顯 bug、TypeScript 錯、動態圖層誤把 currentTime 放進 useEffect deps、Supabase loader 沒接 loadingRegistry。
            無問題回單行「LGTM」即可；有問題最多列 5 點，每點 1 行，繁體中文。
