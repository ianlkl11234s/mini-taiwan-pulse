<title>多指標卡比較</title>
<style>
/* 版面：工具列（寬度、暗淡）→ 8 題，每題「現況截圖｜方案 A｜方案 B」→ 彙整。卡片用分割模式真實寬度、監看字級 S13。 */
:root{color-scheme:dark;--page:#07070f;--panel:#0e0e19;--line:rgba(255,255,255,.09);--line-2:rgba(255,255,255,.16);--text:#d1d5db;--strong:#f3f4f6;--muted:#9ca3af;--dim:#6b7280;--pick:#64aaff;--pick-faint:rgba(100,170,255,.14);--ok:#22c55e;
--font-cjk:"PingFang TC","Microsoft JhengHei","Noto Sans CJK TC",system-ui,sans-serif;--font-data:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
*{box-sizing:border-box}
body{background:var(--page);color:var(--text);font:13px/1.6 var(--font-cjk);margin:0;padding-inline:16px;padding-block:0 80px}
.wrap{max-width:1900px;margin:0 auto;display:flex;flex-direction:column;gap:34px}
h1{margin:0 0 6px;font-size:22px;font-weight:600;color:var(--strong)}
h2{margin:0;font-size:17px;font-weight:600;color:var(--strong)}
p{margin:0}
.lead{max-width:90ch;color:var(--muted)}
.lead b{color:var(--strong);font-weight:600}
code{font-family:var(--font-data);font-size:12px;color:var(--strong)}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:rgba(7,7,15,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);margin-inline:-16px;padding:10px 16px;display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center}
.bar .brand{font-weight:600;color:var(--strong)}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:6px;overflow:hidden}
.seg button{all:unset;cursor:pointer;padding:3px 12px;font:12px var(--font-cjk);color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--pick-faint);color:var(--pick)}
.seg button:focus-visible{outline:2px solid var(--pick);outline-offset:-2px}
.nav{display:flex;flex-wrap:wrap;gap:4px}
.nav a{font:11px var(--font-data);color:var(--muted);text-decoration:none;padding:2px 7px;border-radius:4px;border:1px solid var(--line)}
.nav a.done{color:var(--ok);border-color:rgba(34,197,94,.4)}
.count{margin-left:auto;font:12px var(--font-data);color:var(--muted)}
.count b{color:var(--pick)}
section.q{display:flex;flex-direction:column;gap:12px;scroll-margin-top:64px;border-top:1px solid var(--line-2);padding-top:22px}
.q-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 12px}
.tag{font:700 12px var(--font-data);padding:1px 8px;border-radius:4px;background:var(--pick);color:#07070f}
.q-now{color:var(--muted);font-size:12.5px;max-width:110ch}
.q-now b{color:var(--strong);font-weight:600}
.row3{display:flex;gap:16px;overflow-x:auto;align-items:flex-start;padding-bottom:6px}
.colx{flex:0 0 auto;display:flex;flex-direction:column;gap:8px}
.colx .ol{font:700 12px var(--font-data);color:var(--pick)}
.colx .ol.now{color:var(--muted)}
.colx .ot{font-weight:600;color:var(--strong)}
.colx .os{font-size:12px;color:var(--muted);max-width:var(--cw,640px)}
.colx .os b{color:var(--strong);font-weight:600}
.rb{font-size:11px;color:var(--pick);border:1px solid rgba(100,170,255,.45);border-radius:4px;padding:0 6px;margin-left:6px}
.shot{border:1px dashed var(--line-2);border-radius:8px;overflow:hidden;width:520px;max-width:100%}
.shot img{display:block;width:100%;height:auto}
.pick-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.pl{font-size:12px;color:var(--dim)}
.pbtn{all:unset;cursor:pointer;font:12px var(--font-cjk);padding:4px 12px;border-radius:5px;border:1px solid var(--line-2);color:var(--text)}
.pbtn[aria-pressed="true"]{background:var(--pick);border-color:var(--pick);color:#07070f;font-weight:600}
.pbtn:focus-visible{outline:2px solid var(--pick);outline-offset:2px}
.note-in{flex:1 1 260px;min-width:0;background:transparent;border:1px solid var(--line-2);border-radius:5px;color:var(--strong);font:12px var(--font-cjk);padding:5px 9px}
#outText{width:100%;min-height:200px;background:var(--panel);border:1px solid var(--line-2);border-radius:8px;color:var(--strong);font:12.5px/1.7 var(--font-data);padding:12px 14px}
.hint{font-size:12px;color:var(--dim)}

/* ── 監看卡模擬（S13：13／14／16／19／24；行高 1.45） ── */
.dock{--mb:#0b0c12;--card:rgba(255,255,255,.04);--bd:rgba(255,255,255,.10);--bds:rgba(255,255,255,.06);--ts:#f3f4f6;--td:#d8dce3;--tm:#9ca3af;--tdim:#6b7280;--live:#22c55e;--warn:#ff9800;--err:#ef4444;--hatch:rgba(255,255,255,.16);--grid:rgba(255,255,255,.06);--c1:#64aaff;--c2:#22c55e;--c3:#f59e0b;--c4:#a78bfa;--up:#ef4444;--tile:rgba(255,255,255,.04);
 background:var(--mb);border:1px solid var(--line);border-radius:8px;padding:12px;font-family:var(--font-cjk);color:var(--td);line-height:1.45}
body.lt .dock{--mb:#eef0f3;--card:#fff;--bd:rgba(0,0,0,.10);--bds:rgba(0,0,0,.06);--ts:#111827;--td:#1f2937;--tm:#4b5563;--tdim:#6b7280;--live:#15803d;--warn:#c2410c;--err:#b42318;--hatch:rgba(0,0,0,.16);--grid:rgba(0,0,0,.06);--c1:#0b6fd6;--c2:#15803d;--c3:#b45309;--c4:#7c3aed;--up:#b42318;--tile:rgba(0,0,0,.035)}
.mc{background:var(--card);border:1px solid var(--bd);border-radius:6px;padding:10px 12px;display:flex;flex-direction:column;gap:10px;min-width:0;overflow:hidden}
.hd{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 6px}
.hd .zh{font-size:16px;font-weight:700;color:var(--ts)}
.hd .en{font-size:13px;color:var(--tdim)}
.hd .r{margin-left:auto;display:inline-flex;gap:6px;align-items:baseline;white-space:nowrap}
.hd .tm{font:13px var(--font-data);color:var(--tdim)}
.pill{font-size:13px;line-height:1;padding:2px 5px;border-radius:4px;border:1px solid currentColor;white-space:nowrap}
.pill.e{color:var(--err)}.pill.w{color:var(--warn)}.pill.n{color:var(--tm)}.pill.g{color:var(--live)}
.st{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--tm)}
.st i{width:7px;height:7px;border-radius:50%;background:var(--live);display:inline-block}
.vl{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 8px}
.vl .n{font:700 24px/1.1 var(--font-data);color:var(--ts);white-space:nowrap}
.vl .n.m{color:var(--tm)}
.vl .u{font-size:14px;color:var(--tm);white-space:nowrap}
.vl .d{font:14px var(--font-data);white-space:nowrap}
.sub{font-size:13px;color:var(--tm);display:flex;flex-wrap:wrap;gap:2px 12px}
.sub span{white-space:nowrap}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:6px 14px}
.kpi{display:flex;flex-direction:column;min-width:0}
.kpi .kl{font-size:13px;color:var(--tm);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .kv{font:700 19px/1.2 var(--font-data);color:var(--ts);white-space:nowrap}
.kpi .kv small{font:400 13px var(--font-cjk);color:var(--tm);margin-left:3px}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px 18px}
.ch{display:flex;flex-direction:column;gap:2px;min-width:0}
.ch svg,.sm svg{display:block;width:100%}
.cap{font-size:13px;color:var(--tm)}
.ax{display:flex;justify-content:space-between;gap:8px;font:13px var(--font-data);color:var(--tdim);white-space:nowrap}
.lgd{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:13px;color:var(--tm)}
.lgd i{display:inline-block;width:10px;height:2px;vertical-align:middle;margin-right:4px}
.sm{display:grid;grid-template-columns:minmax(64px,auto) minmax(0,1fr) auto;gap:10px;align-items:center;font-size:13px;color:var(--tm);padding:3px 0;border-top:1px solid var(--bds)}
.sm:first-of-type{border-top:0}
.sm .v{font:700 14px var(--font-data);color:var(--ts);text-align:right;white-space:nowrap;min-width:70px}
.sm .v small{font:400 13px var(--font-cjk);color:var(--tm);margin-left:2px}
.bars-h{display:grid;grid-template-columns:minmax(52px,auto) minmax(0,1fr) auto;gap:10px;align-items:center;font-size:13px;color:var(--tm)}
.bars-h .tr{height:6px;border-radius:3px;background:var(--grid);overflow:hidden}
.bars-h .tr b{display:block;height:100%;background:var(--c1)}
.bars-h .v{font:13px var(--font-data);color:var(--ts);white-space:nowrap;text-align:right}
.tbl{display:flex;flex-direction:column}
.tr5{display:grid;grid-template-columns:56px 90px minmax(0,1fr) auto;gap:8px;font-size:14px;padding:3px 0;border-top:1px solid var(--bds)}
.tr5:first-child{border-top:0}
.tr5 .no{font:700 14px var(--font-data);color:var(--ts)}
.tr5 .rt{color:var(--tm);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tr5 .mn{font:700 14px var(--font-data);color:var(--err)}
.foot{font-size:13px;color:var(--tdim)}
.note{font-size:13px;color:var(--warn)}
.er{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:6px}
.er > div{display:flex;align-items:center;gap:6px;padding:4px 6px;border-radius:4px;background:var(--tile);min-width:0}
.er .nm{display:flex;flex-direction:column;min-width:0;flex:1}
.er .nm span{font-size:13px;color:var(--td);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.er .nm b{font:700 14px var(--font-data)}
.er svg{flex:0 0 52px;width:52px}
.grp{font-size:13px;color:var(--tm);display:flex;gap:10px;align-items:baseline}
.grp b{color:var(--ts);font-size:14px}
.stack{height:8px;border-radius:4px;overflow:hidden;display:flex}
.stack i{display:block;height:100%}
details.more summary{cursor:pointer;font-size:13px;color:var(--c1);list-style:none}
details.more summary::-webkit-details-marker{display:none}
</style>

<div class="bar">
  <span class="brand">多指標卡比較</span>
  <span class="seg" role="group" aria-label="螢幕寬度">
    <button type="button" data-w="1920" aria-pressed="true">1920 螢幕</button>
    <button type="button" data-w="1496" aria-pressed="false">1496 螢幕</button>
  </span>
  <span class="seg" role="group" aria-label="主題">
    <button type="button" data-th="dk" aria-pressed="true">暗</button>
    <button type="button" data-th="lt" aria-pressed="false">淡</button>
  </span>
  <nav class="nav" id="nav" aria-label="題目"></nav>
  <span class="count" id="count"></span>
</div>

<div class="wrap">
<header style="padding-top:22px">
  <h1>P3 多指標卡：8 張卡的排法</h1>
  <p class="lead">每題左邊是<b>現況截圖</b>（已套 P1／P2 的卡片框與字級），右邊是兩個方案，用分割模式的<b>真實寬度</b>與監看字級 S13 畫（1920 螢幕全寬卡 835px、半寬 412px；可切 1496）。數值取自 10/02 截圖；走勢形狀是示意。共同規則已拍板：主圖＋小倍數（名稱｜走勢｜最新值，共用時間軸），全寬卡最多 2 個主圖並排，同單位最多 3 條線可疊、名稱標在線尾。<b>藍框＝建議</b>，都可以補充意見。</p>
</header>

<div id="qs" style="display:flex;flex-direction:column;gap:34px"></div>

<section id="out" class="q" style="gap:10px">
  <h2>彙整</h2>
  <textarea id="outText" aria-label="選擇彙整"></textarea>
  <div class="pick-row"><button type="button" class="pbtn" id="copy">複製選擇</button><span class="hint" id="copyHint">選擇記在這台瀏覽器；貼回對話即可。</span></div>
</section>
</div>

 {c:"N-B",t:"四個 KPI＋歷史圖",s:"只留四個 KPI（IPv4／IPv6 並列）＋一張歷史圖（大階 96）；RIS 收成一行。最短，但看不到各指標的走勢。",f:()=>`<div class="mc">${hd("網路觀察","RIPE NCC",'<span class="pill g">量測可用</span><span class="tm">12:29</span>')}${kp([["Ping 成功率","97.9／89.7","%"],["中位 RTT","4.7／8.6","ms"],["Probe 回報率","90.8／95.1","%"],["可達 ASN","82.4／77.3","%"]])}<div class="ch">${multi([{d:NET4,c:"var(--c1)"},{d:NET6,c:"var(--c4)"}],{h:96})}<div class="lgd"><span><i style="background:var(--c1)"></i>IPv4</span><span><i style="background:var(--c4)"></i>IPv6</span></div>${ax("前 24 小時","現在")}</div><div class="sub"><span>RIS 路由觀測：部分 · 基準建立中</span></div></div>`}]},

const KEY="mtp-monitor-p3-picks-v1";let state={};try{state=JSON.parse(localStorage.getItem(KEY)||"{}")}catch(e){state={}}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}};
function render(){
  const W=+document.querySelector('[data-w][aria-pressed="true"]').dataset.w;const full=GRID[W],half=Math.floor((full-10)/2);
  document.getElementById("qs").innerHTML=Q.map(q=>{const cw=q.half?half:full;
    const opts=q.opts.map(o=>`<div class="colx" style="--cw:${cw+26}px"><div><span class="ol">${o.c}</span> <span class="ot">${o.t}</span>${o.rec?'<span class="rb">建議</span>':""}</div><p class="os">${o.s}</p><div class="dock" style="width:${cw+26}px">${o.f()}</div></div>`).join("");
    const btns=q.opts.map(o=>`<button type="button" class="pbtn" data-q="${q.id}" data-c="${o.c}" aria-pressed="false">${o.c}</button>`).join("");
    return `<section class="q" id="q-${q.id}"><div class="q-head"><span class="tag">${q.id}</span><h2>${q.title}</h2></div><p class="q-now">現況：${q.now}</p><div class="row3"><div class="colx"><span class="ol now">現況</span><div class="shot"><img src="${IMG[{P:"power",E:"er",L:"pla",V:"vessel",I:"isr",T:"tra",N:"net",A:"air"}[q.id]]}" alt="${q.title}現況截圖"></div></div>${opts}</div><div class="pick-row"><span class="pl">選</span>${btns}<input class="note-in" id="note-${q.id}" data-q="${q.id}" placeholder="補充（選填）" aria-label="${q.id} 補充"></div></section>`}).join("");
  sync();
}
function sync(){let n=0;Q.forEach(q=>{const s=state[q.id]||{};if(s.c)n++;document.querySelectorAll(`.pbtn[data-q="${q.id}"]`).forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.c===s.c)));const ni=document.getElementById("note-"+q.id);if(ni&&document.activeElement!==ni)ni.value=s.note||"";const a=document.getElementById("nav-"+q.id);if(a)a.classList.toggle("done",!!s.c)});
  document.getElementById("count").innerHTML=`已選 <b>${n}</b> / ${Q.length}`;
  document.getElementById("outText").value="P3 多指標卡選擇\n"+Q.map(q=>{const s=state[q.id]||{};return `${q.id} ${q.title}：${s.c||"（未選）"}${s.note?"　補充："+s.note:""}`}).join("\n")}
document.getElementById("nav").innerHTML=Q.map(q=>`<a href="#q-${q.id}" id="nav-${q.id}">${q.id}</a>`).join("")+'<a href="#out">彙整</a>';
document.getElementById("qs").addEventListener("click",e=>{const b=e.target.closest(".pbtn");if(!b)return;const s=state[b.dataset.q]||(state[b.dataset.q]={});s.c=s.c===b.dataset.c?"":b.dataset.c;save();sync()});
document.getElementById("qs").addEventListener("input",e=>{const i=e.target.closest(".note-in");if(!i)return;const s=state[i.dataset.q]||(state[i.dataset.q]={});s.note=i.value;save();sync()});
document.querySelectorAll("[data-w]").forEach(b=>b.addEventListener("click",()=>{document.querySelectorAll("[data-w]").forEach(x=>x.setAttribute("aria-pressed",String(x===b)));render()}));
document.querySelectorAll("[data-th]").forEach(b=>b.addEventListener("click",()=>{document.querySelectorAll("[data-th]").forEach(x=>x.setAttribute("aria-pressed",String(x===b)));document.body.classList.toggle("lt",b.dataset.th==="lt")}));
document.getElementById("copy").addEventListener("click",()=>{const ta=document.getElementById("outText"),h=document.getElementById("copyHint");navigator.clipboard.writeText(ta.value).then(()=>{h.textContent="已複製。"}).catch(()=>{ta.select();h.textContent="請按 ⌘C 複製。"})});
render();
</script>
