<title>Pulse 城市脈動調整</title>
<style>
:root{color-scheme:dark;--page:#07070f;--text:#d1d5db;--strong:#f3f4f6;--muted:#9ca3af;--dim:#6b7280;--line:rgba(255,255,255,.09);--pick:#64aaff;--pick-faint:rgba(100,170,255,.14);
--font-cjk:"PingFang TC","Microsoft JhengHei","Noto Sans CJK TC",system-ui,sans-serif;--font-data:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
*{box-sizing:border-box}
body{background:var(--page);color:var(--text);font:13px/1.65 var(--font-cjk);margin:0;padding-inline:16px;padding-block:0 96px}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
h1{margin:24px 0 6px;font-size:22px;font-weight:600;color:var(--strong);text-wrap:balance}
p{margin:0}
.lead{max-width:84ch;color:var(--muted)}.lead b{color:var(--strong);font-weight:600}
code{font-family:var(--font-data);font-size:12px;color:var(--strong)}
.panel{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:rgba(7,7,15,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);margin-inline:-16px;padding:10px 16px}
.panel-in{max-width:1180px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px 22px;align-items:center}
.ctl{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;font-size:12px;color:var(--muted)}
.ctl output{font:12px var(--font-data);color:var(--strong);font-variant-numeric:tabular-nums;min-width:7ch;text-align:right}
input[type=range]{width:100%;accent-color:var(--pick)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
button{font:12px var(--font-cjk);color:var(--muted);background:transparent;border:1px solid rgba(255,255,255,.16);border-radius:6px;padding:4px 11px;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--pick);outline-offset:2px}
button[aria-pressed="true"]{color:var(--strong);background:var(--pick-faint);border-color:rgba(100,170,255,.45)}
.spec{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--dim)}
.spec code{background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:4px;padding:2px 6px}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:760px){.pair{grid-template-columns:1fr}}
figure{margin:0;display:flex;flex-direction:column;gap:6px}
figcaption{font-size:11px;color:var(--dim)}
.notes{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:6px 22px;color:var(--muted);font-size:12.5px}
.scr{--app:#0a0a14;--strong-s:rgba(10,10,20,.88);--bd:rgba(255,255,255,.10);--bd-mid:rgba(255,255,255,.14);--t-strong:#f3f4f6;--t-dim:#6b7280;--acc:#64aaff;--live:#22c55e;--map:#1b1c20;--road:#2a2b31;--rail:#0a0a14;
--c-flight:#64aaff;--c-ship:#4ecdc4;--c-rail:#f4a261;--land:rgba(100,170,255,.05);
--k:1;container-type:inline-size;position:relative;aspect-ratio:16/10;max-width:100%;border-radius:8px;overflow:hidden;border:1px solid var(--line);background:var(--app);font-family:var(--font-cjk)}
.scr.light{--app:#f4f5f7;--strong-s:rgba(255,255,255,.97);--bd:rgba(0,0,0,.10);--bd-mid:rgba(0,0,0,.14);--t-strong:#111827;--t-dim:#6b7280;--acc:#2563eb;--live:#16a34a;--map:#e7e9ed;--road:#ffffff;--rail:#ffffff;
--c-flight:#2563eb;--c-ship:#0f9488;--c-rail:#d9731f;--land:rgba(37,99,235,.06)}
.map{position:absolute;inset:0;opacity:0;transition:opacity calc(1s / var(--k));background:
 linear-gradient(115deg,transparent 47%,var(--road) 47.4%,var(--road) 48.2%,transparent 48.6%),
 linear-gradient(20deg,transparent 60%,var(--road) 60.3%,var(--road) 61%,transparent 61.3%),
 linear-gradient(170deg,transparent 30%,var(--road) 30.3%,var(--road) 30.9%,transparent 31.2%),var(--map)}
.c-rail{position:absolute;left:0;top:0;width:7%;height:62%;background:var(--rail);border-right:1px solid var(--bd);display:flex;flex-direction:column;align-items:center;gap:7%;padding-top:3%}
.c-rail i{width:42%;aspect-ratio:1;border-radius:3px;border:1.5px solid var(--t-dim)}
.c-rail hr{width:60%;border:0;border-top:1px solid var(--bd);margin:0}
.c-title{position:absolute;left:9%;top:3%;font:700 2.6cqw/1.1 var(--font-data);letter-spacing:.14em;color:var(--t-strong);white-space:nowrap}
.c-title small{display:block;font:400 .5em/1.6 var(--font-data);letter-spacing:.02em;color:var(--t-dim)}
.c-tb{position:absolute;left:68%;top:3%;width:30%;height:6.5%;border-radius:5px;background:var(--strong-s);border:1px solid var(--bd)}
.c-tl{position:absolute;left:8%;top:87.5%;width:21%;height:6.5%;border-radius:99px;background:var(--strong-s);border:1px solid var(--bd)}
.pill{position:absolute;left:50%;top:92%;transform:translate(-50%,-50%);display:flex;align-items:center;gap:5px;height:2.2cqw;min-height:14px;padding:0 8px;border-radius:5px;background:var(--strong-s);border:1px solid var(--bd);font-size:clamp(7px,1.05cqw,11px);color:var(--t-strong);white-space:nowrap;transition:opacity calc(.3s / var(--k))}
.pill .ring{width:.8em;height:.8em;border:1.5px solid var(--bd-mid);border-top-color:var(--acc);border-radius:50%;animation:spin .9s linear infinite}
.pill .ok,.pill .d{display:none}.pill .ok{color:var(--live)}
.s-done .pill .ring,.s-done .pill .l{display:none}.s-done .pill .ok,.s-done .pill .d{display:inline}
.s-enter .pill{opacity:0}
.s-reset,.s-reset *{transition:none!important}

/* M2 進場（定案） */
.s-done .map{opacity:1}
.c-rail{transform:translateX(-105%)}.c-tb{transform:translateY(-170%)}.c-tl{transform:translateY(260%)}.c-title{transform:translateY(-220%)}
.c-rail i,.c-rail hr{transform:scale(0)}
.c-rail,.c-tb,.c-tl,.c-title{transition:transform calc(.55s / var(--k)) cubic-bezier(.34,1.56,.64,1)}
.c-rail i,.c-rail hr{transition:transform calc(.3s / var(--k)) cubic-bezier(.34,1.8,.64,1)}
.s-enter .c-rail,.s-enter .c-tb,.s-enter .c-tl,.s-enter .c-title,.s-enter .c-rail i,.s-enter .c-rail hr{transform:none}
.s-enter .c-tb{transition-delay:calc(.08s / var(--k))}.s-enter .c-tl{transition-delay:calc(.16s / var(--k))}.s-enter .c-title{transition-delay:calc(.24s / var(--k))}
.s-enter .c-rail hr{transition-delay:calc(.3s / var(--k))}
.s-enter .c-rail i:nth-of-type(1){transition-delay:calc(.28s / var(--k))}.s-enter .c-rail i:nth-of-type(2){transition-delay:calc(.34s / var(--k))}.s-enter .c-rail i:nth-of-type(3){transition-delay:calc(.38s / var(--k))}.s-enter .c-rail i:nth-of-type(4){transition-delay:calc(.42s / var(--k))}.s-enter .c-rail i:nth-of-type(5){transition-delay:calc(.46s / var(--k))}
.s-settle .c-tb,.s-settle .c-tl{animation:latch calc(.4s / var(--k)) ease-out}


.wait{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(var(--gap) * 1cqw);transition:opacity calc(.45s / var(--k)) ease,transform calc(.45s / var(--k)) ease}
.s-done .wait{opacity:0;transform:scale(1.04)}
.wait svg{height:calc(var(--size) * 1%);overflow:visible;flex:none}
.wm{font:700 1.3cqw/1 var(--font-data);letter-spacing:.3em;color:var(--t-strong);opacity:.85}
.wm span{color:var(--acc)}
.wait .pill{position:static;transform:none}
.tw{fill:var(--land);stroke:var(--acc);stroke-width:.5;stroke-linejoin:round;vector-effect:non-scaling-stroke;opacity:.75}
.city{fill:var(--acc);transform-box:fill-box;transform-origin:center}
.city-r{fill:none;stroke:var(--acc);stroke-width:1;vector-effect:non-scaling-stroke;transform-box:fill-box;transform-origin:center;opacity:0}
.s-load .city-r{animation:ripple calc(var(--cycle) * 1s / var(--k)) ease-out infinite;animation-delay:calc(var(--d) * var(--cycle) * 1s / var(--k))}
.s-load .city{animation:blink calc(var(--cycle) * 1s / var(--k)) ease-out infinite;animation-delay:calc(var(--d) * var(--cycle) * 1s / var(--k))}
.cname{font:6px var(--font-cjk);fill:var(--t-dim)}
.nolabel .cname{display:none}
.nowm .wm{display:none}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes ripple{0%{transform:scale(1);opacity:.9}70%,100%{transform:scale(var(--rip));opacity:0}}
@keyframes blink{0%{transform:scale(1.8)}25%,100%{transform:scale(1)}}
@keyframes latch{0%{border-color:var(--acc)}100%{border-color:var(--bd)}}
@media(prefers-reduced-motion:reduce){.scr *{animation:none!important;transition-duration:.01s!important}}
</style>

<div class="panel"><div class="panel-in">
  <label class="ctl" for="size">島嶼高度<input id="size" type="range" min="10" max="60" step="1" value="24"><output id="size-o"></output></label>
  <label class="ctl" for="dot">城市點大小<input id="dot" type="range" min="0.6" max="3" step="0.1" value="1.4"><output id="dot-o"></output></label>
  <label class="ctl" for="rip">波紋擴散<input id="rip" type="range" min="2" max="10" step="0.5" value="5"><output id="rip-o"></output></label>
  <label class="ctl" for="cycle">一輪時間<input id="cycle" type="range" min="1.2" max="4" step="0.1" value="2.2"><output id="cycle-o"></output></label>
  <div class="row">
    <button type="button" id="lbl" aria-pressed="false">城市名稱</button>
    <button type="button" id="wm" aria-pressed="true">品牌字</button>
    <button type="button" id="hold" aria-pressed="true">停在等待</button>
    <button type="button" id="enter">播放進場</button>
  </div>
  <div class="spec">目前設定 <code id="spec"></code> <button type="button" id="copy">複製</button></div>
</div></div>

<div class="wrap">
<header>
  <h1>W2 城市脈動：大小調整</h1>
  <p class="lead">預覽框是 <b>1440×900</b> 螢幕的等比縮小。島嶼高度用「佔螢幕高度的百分比」表示，旁邊換算成 1440×900 時的像素。調好後按「複製」把設定貼給我。</p>
</header>
<div class="pair">
  <figure><div class="scr" data-scene></div><figcaption>暗色</figcaption></figure>
  <figure><div class="scr light" data-scene></div><figcaption>淡色</figcaption></figure>
</div>
<div class="notes">
  <p>離島含澎湖、金門、馬祖、綠島、蘭嶼、小琉球、龜山島等，取自專案縣市界資料（<code>public/statistics/county-reference-2025.geojson</code>）簡化。</p>
  <p>範圍限在經度 118°–122.2°、緯度 21.8°–26.5°，東沙、太平島、釣魚台沒有畫進來（會讓本島縮得太小）；需要的話可以另外加。</p>
  <p>亮起順序由北往南：馬祖、台北、新竹、金門、台中、花蓮、澎湖、台南、高雄。</p>
</div>
</div>
